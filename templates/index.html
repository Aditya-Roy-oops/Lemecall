<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reliable Video Call</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; }
        .video-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 90%; margin-top: 20px; }
        video { width: 100%; border-radius: 15px; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .ui-panel { margin-top: 30px; background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        input { padding: 12px; border-radius: 8px; border: none; background: #2a2a2a; color: white; margin-right: 10px; }
        button { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
        .btn-join { background: #0070f3; color: white; }
        .btn-end { background: #ff4d4d; color: white; display: none; }
        #status { margin-top: 15px; color: #888; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <input type="text" id="roomInput" placeholder="Enter Room ID">
        <button id="joinBtn" class="btn-join">Join Room</button>
        <button id="endBtn" class="btn-end">End Call</button>
        <div id="status">Status: Waiting to start...</div>
    </div>

    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        const PUSHER_KEY = 'c7f2cd8e7835a9dc4425';
        const PUSHER_CLUSTER = 'ap2';
        let localStream, pc, roomId, channel;

        const pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
        
        // Updated ICE Servers with more global STUNs
        const iceConfig = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' }
            ],
            iceCandidatePoolSize: 10
        };

        document.getElementById('joinBtn').onclick = async () => {
            roomId = document.getElementById('roomInput').value;
            if (!roomId) return alert("Please enter a Room ID");

            document.getElementById('status').innerText = "Status: Initializing Media...";
            
            try {
                // Higher quality constraints for better "real" feel
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true
                });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                alert("Camera error: " + err.message);
                return;
            }

            initPeerConnection();
            
            channel = pusher.subscribe(`room-${roomId}`);
            channel.bind('new-signal', async (data) => {
                if (data.sender === pusher.connection.socket_id) return;

                if (data.type === 'ready') {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    sendSignal(offer);
                } else if (data.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    sendSignal(answer);
                } else if (data.type === 'answer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                } else if (data.candidate) {
                    try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e) {}
                } else if (data.type === 'end') {
                    location.reload();
                }
            });

            sendSignal({ type: 'ready' });
            document.getElementById('joinBtn').style.display = 'none';
            document.getElementById('endBtn').style.display = 'inline-block';
            document.getElementById('status').innerText = "Status: Waiting for partner...";
        };

        function initPeerConnection() {
            pc = new RTCPeerConnection(iceConfig);
            
            // Add tracks to the connection
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            // CRITICAL: This is what catches the remote video
            pc.ontrack = (event) => {
                const remoteVid = document.getElementById('remoteVideo');
                if (remoteVid.srcObject !== event.streams[0]) {
                    remoteVid.srcObject = event.streams[0];
                    document.getElementById('status').innerText = "Status: Live!";
                }
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) sendSignal({ candidate: event.candidate });
            };

            // Watch for connection state
            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'connected') {
                    document.getElementById('status').innerText = "Status: Handshake Success!";
                }
                if (pc.connectionState === 'failed') {
                    document.getElementById('status').innerText = "Status: Connection Failed (Firewall issues)";
                }
            };
        }

        async function sendSignal(data) {
            await fetch('/send-signal', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ...data, room: roomId, sender: pusher.connection.socket_id })
            });
        }

        document.getElementById('endBtn').onclick = () => {
            sendSignal({ type: 'end' });
            location.reload();
        };
    </script>
</body>
</html>
