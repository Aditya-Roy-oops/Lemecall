<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Next-Gen Video Call</title>
    <style>
        :root { --accent: #00f2fe; --glass: rgba(255, 255, 255, 0.1); }
        body { font-family: 'Inter', sans-serif; background: #0b0e11; color: #fff; margin: 0; overflow: hidden; display: flex; height: 100vh; }
        
        /* Video Section */
        .meeting-area { flex: 1; display: flex; flex-direction: column; padding: 20px; position: relative; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 15px; flex: 1; }
        .video-wrapper { position: relative; border-radius: 16px; overflow: hidden; background: #1c1f24; border: 1px solid var(--glass); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Chat Sidebar */
        .chat-sidebar { width: 350px; background: #16191d; border-left: 1px solid #2d333b; display: none; flex-direction: column; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; }
        .chat-input { padding: 15px; display: flex; gap: 5px; }
        
        /* Controls */
        .controls-bar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(0,0,0,0.8); padding: 12px 25px; border-radius: 40px; backdrop-filter: blur(10px); }
        .btn-circle { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.2s; }
        .btn-primary { background: #3c4043; color: white; }
        .btn-danger { background: #ea4335; color: white; }
        .active-blue { background: #8ab4f8; color: #202124; }
    </style>
</head>
<body>

    <div class="meeting-area">
        <div class="video-grid" id="videoGrid">
            <div class="video-wrapper"><video id="localVideo" autoplay muted playsinline></video></div>
            <div class="video-wrapper"><video id="remoteVideo" autoplay playsinline></video></div>
        </div>

        <div class="controls-bar">
            <button onclick="toggleMic()" id="micBtn" class="btn-circle btn-primary">🎤</button>
            <button onclick="toggleCam()" id="camBtn" class="btn-circle btn-primary">📷</button>
            <button onclick="shareScreen()" id="screenBtn" class="btn-circle btn-primary">📺</button>
            <button onclick="toggleChat()" class="btn-circle btn-primary">💬</button>
            <button onclick="endCall()" class="btn-circle btn-danger">📞</button>
        </div>
    </div>

    <div class="chat-sidebar" id="chatSidebar">
        <h3 style="padding: 15px;">Live Chat</h3>
        <div id="chat-messages"></div>
        <div class="chat-input">
            <input type="text" id="chatMsg" style="flex:1; padding:8px; border-radius:5px;" placeholder="Message...">
            <button onclick="sendChat()">Send</button>
        </div>
    </div>

    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        const PUSHER_KEY = 'c7f2cd8e7835a9dc4425';
        let localStream, pc, roomId, channel, screenStream;
        const pusher = new Pusher(PUSHER_KEY, { cluster: 'ap2' });
        const iceConfig = { iceServers: [{ urls: "stun:stun.relay.metered.ca:80" }, { urls: "turn:global.relay.metered.ca:80", username: "d1ef88d6301c48637e8bf9c7", credential: "vswYqgZljtLXECWu" }] };

        // Automatically prompt for room ID on load if not in URL
        window.onload = () => { roomId = prompt("Enter Room ID:") || 'demo'; startMeeting(); };

        async function startMeeting() {
            localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('localVideo').srcObject = localStream;
            
            initPeerConnection();
            channel = pusher.subscribe(`room-${roomId}`);
            
            channel.bind('new-signal', async data => {
                if (data.sender === pusher.connection.socket_id) return;
                if (data.type === 'ready') { const offer = await pc.createOffer(); await pc.setLocalDescription(offer); sendSignal(offer); }
                else if (data.type === 'offer') { await pc.setRemoteDescription(new RTCSessionDescription(data)); const answer = await pc.createAnswer(); await pc.setLocalDescription(answer); sendSignal(answer); }
                else if (data.type === 'answer') await pc.setRemoteDescription(new RTCSessionDescription(data));
                else if (data.candidate) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            });

            channel.bind('new-chat', data => {
                const msgBox = document.getElementById('chat-messages');
                msgBox.innerHTML += `<div><b>${data.sender.substring(0,4)}:</b> ${data.message}</div>`;
            });

            sendSignal({ type: 'ready' });
        }

        function initPeerConnection() {
            pc = new RTCPeerConnection(iceConfig);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
            pc.onicecandidate = e => e.candidate && sendSignal({ candidate: e.candidate });
        }

        async function shareScreen() {
            screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const videoTrack = screenStream.getVideoTracks()[0];
            const sender = pc.getSenders().find(s => s.track.kind === 'video');
            sender.replaceTrack(videoTrack);
            document.getElementById('localVideo').srcObject = screenStream;
            videoTrack.onended = () => stopScreenShare();
        }

        function stopScreenShare() {
            const videoTrack = localStream.getVideoTracks()[0];
            const sender = pc.getSenders().find(s => s.track.kind === 'video');
            sender.replaceTrack(videoTrack);
            document.getElementById('localVideo').srcObject = localStream;
        }

        async function sendSignal(data) {
            fetch('/send-signal', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({...data, room: roomId, sender: pusher.connection.socket_id}) });
        }

        async function sendChat() {
            const msg = document.getElementById('chatMsg').value;
            fetch('/send-chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({room: roomId, message: msg, sender: pusher.connection.socket_id}) });
            document.getElementById('chatMsg').value = '';
        }

        function toggleMic() {
            const audioTrack = localStream.getAudioTracks()[0];
            audioTrack.enabled = !audioTrack.enabled;
            document.getElementById('micBtn').classList.toggle('active-blue');
        }

        function toggleCam() {
            const videoTrack = localStream.getVideoTracks()[0];
            videoTrack.enabled = !videoTrack.enabled;
            document.getElementById('camBtn').classList.toggle('active-blue');
        }

        function toggleChat() {
            const sidebar = document.getElementById('chatSidebar');
            sidebar.style.display = sidebar.style.display === 'flex' ? 'none' : 'flex';
        }

        function endCall() { sendSignal({type: 'end'}); location.reload(); }
    </script>
</body>
</html>
