<!DOCTYPE html>
<html>
<head>
    <title>Reliable Video Call</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; }
        .video-container { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        video { width: 40%; background: #000; border-radius: 10px; border: 2px solid #333; }
        .controls { background: #1e1e1e; padding: 20px; border-bottom: 2px solid #333; }
        button { padding: 12px 24px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        #joinBtn { background: #0070f3; color: white; }
        #endBtn { background: #ff4d4d; color: white; display: none; }
        input { padding: 11px; border-radius: 6px; border: 1px solid #444; background: #222; color: white; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="roomInput" placeholder="Room ID">
        <button id="joinBtn">Start / Join</button>
        <button id="endBtn">Leave Call</button>
        <p id="status">Status: Waiting</p>
    </div>

    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        const PUSHER_KEY = 'c7f2cd8e7835a9dc4425';
        const PUSHER_CLUSTER = 'ap2';
        
        let localStream, pc, roomId, channel;
        const pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
        const iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function cleanup() {
            if (pc) {
                pc.close();
                pc = null;
            }
            if (channel) {
                pusher.unsubscribe(`room-${roomId}`);
            }
            document.getElementById('remoteVideo').srcObject = null;
        }

        document.getElementById('joinBtn').onclick = async () => {
            roomId = document.getElementById('roomInput').value;
            if (!roomId) return alert("Enter Room ID");

            await cleanup(); // Clear any old junk connection
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('status').innerText = "Joining Room...";

                initPeerConnection();
                
                channel = pusher.subscribe(`room-${roomId}`);
                channel.bind('new-signal', async (data) => {
                    if (data.sender === pusher.connection.socket_id) return;

                    if (data.type === 'ready') {
                        // A new user is ready, so we (the existing user) create the offer
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        sendSignal(offer);
                    } else if (data.type === 'offer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        sendSignal(answer);
                    } else if (data.type === 'answer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(data));
                    } else if (data.candidate) {
                        try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e) {}
                    }
                });

                // Crucial: Tell the room we are ready to start
                setTimeout(() => sendSignal({ type: 'ready' }), 1000);

                document.getElementById('joinBtn').style.display = 'none';
                document.getElementById('endBtn').style.display = 'inline-block';
                document.getElementById('status').innerText = "In Room: " + roomId;

            } catch (err) {
                alert("Could not access camera: " + err);
            }
        };

        function initPeerConnection() {
            pc = new RTCPeerConnection(iceConfig);
            
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) sendSignal({ candidate: event.candidate });
            };

            // Watch for disconnection
            pc.oniceconnectionstatechange = () => {
                if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                    document.getElementById('status').innerText = "Partner left.";
                    document.getElementById('remoteVideo').srcObject = null;
                }
            };
        }

        async function sendSignal(data) {
            await fetch('/send-signal', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ...data, room: roomId, sender: pusher.connection.socket_id })
            });
        }

        document.getElementById('endBtn').onclick = () => {
            location.reload(); // Hard reset for the next run
        };
    </script>
</body>
</html>
