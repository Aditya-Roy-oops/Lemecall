<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlassCall Pro</title>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-thick: rgba(255, 255, 255, 0.2);
            --accent: #00f2fe;
            --danger: #ff4d4d;
            --bg-dark: #0f172a;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Inter', sans-serif; background: var(--bg-dark); 
            color: white; overflow: hidden;
        }

        /* --- LOBBY UI --- */
        #lobby {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #1e293b, #0f172a); z-index: 1000;
        }
        .lobby-card {
            background: var(--glass); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 28px; border: 1px solid var(--glass-thick);
            text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* --- MEETING UI --- */
        #meeting-ui { display: none; width: 100%; height: 100%; position: relative; }

        /* Navbar */
        .navbar {
            position: absolute; top: 0; left: 0; right: 0; height: 60px;
            background: var(--glass); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-thick);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 800;
        }
        .session-info { font-size: 14px; letter-spacing: 0.5px; color: #cbd5e1; }
        .session-code { color: var(--accent); font-weight: bold; margin-left: 5px; }

        /* Draggable Local Video */
        #local-container {
            position: absolute; width: 180px; aspect-ratio: 16/9;
            top: 80px; right: 20px; z-index: 500; cursor: move;
            border-radius: 16px; overflow: hidden; border: 2px solid var(--glass-thick);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); touch-action: none;
        }
        #localVideo { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        /* --- STAGE (REMOTE VIDEO) --- */
        /* FIX: Made stage fill the entire screen and centered the video */
        .stage { 
            width: 100%; height: 100vh; background: #000; 
            display: flex; align-items: center; justify-content: center;
        }
        #remoteVideo { 
            width: 100%; height: 100%; 
            object-fit: cover; /* Change to cover to fill screen, or contain to see full frame */
            transition: all 0.3s ease;
        }

        /* Controls */
        .controls {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; padding: 12px 25px;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px);
            border-radius: 40px; border: 1px solid var(--glass-thick); z-index: 600;
        }
        .btn {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            cursor: pointer; font-size: 20px; background: var(--glass-thick); color: white;
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .btn:hover { background: var(--glass); transform: scale(1.1); }
        .btn.off { background: var(--danger); }

        /* Chat Window */
        #chat-window {
            position: fixed; right: 20px; bottom: 100px; width: 320px; height: 400px;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px);
            border-radius: 24px; border: 1px solid var(--glass-thick);
            display: none; flex-direction: column; z-index: 700;
        }
        #chat-body { flex: 1; padding: 15px; overflow-y: auto; scroll-behavior: smooth; }

        @media (max-width: 768px) {
            #local-container { width: 120px; }
            .controls { bottom: 20px; width: 95%; justify-content: space-around; }
        }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="lobby-card">
            <h1 style="margin: 0 0 10px 0;">GlassCall</h1>
            <input type="text" id="roomInput" placeholder="Meeting Code" style="width:100%; padding:15px; border-radius:12px; border:none; background:rgba(255,255,255,0.05); color:white; margin: 20px 0; border: 1px solid var(--glass-thick);">
            <button id="joinBtn" style="width:100%; padding:15px; border-radius:12px; background:var(--accent); color:#000; font-weight:bold; border:none; cursor:pointer;">Join Meeting</button>
        </div>
    </div>

    <div id="meeting-ui">
        <nav class="navbar">
            <div class="session-info">Code: <span id="display-room-id" class="session-code"></span></div>
            <div style="font-weight: 800; font-size: 20px; color: var(--accent);">GlassCall</div>
            <button id="pipBtn" class="btn" style="width: 35px; height: 35px; font-size: 14px;" title="Picture in Picture">🖼️</button>
        </nav>

        <div id="local-container">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>

        <div class="stage">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <div class="controls">
            <button onclick="toggleMic()" id="micBtn" class="btn">🎤</button>
            <button onclick="toggleCam()" id="camBtn" class="btn">📷</button>
            <button onclick="toggleShare()" id="shareBtn" class="btn">📺</button>
            <button onclick="toggleChat()" class="btn">💬</button>
            <button onclick="location.reload()" class="btn" style="background:var(--danger)">📞</button>
        </div>

        <div id="chat-window">
            <div style="padding:15px; border-bottom:1px solid var(--glass-thick); display:flex; justify-content:space-between; align-items: center;">
                <b style="font-size: 14px;">LIVE CHAT</b>
                <button onclick="toggleChat()" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">✕</button>
            </div>
            <div id="chat-body"></div>
            <div style="padding:15px; display:flex; gap:8px; border-top: 1px solid var(--glass-thick);">
                <input type="text" id="chatMsg" placeholder="Message..." style="flex:1; background:var(--glass); border:none; color:white; border-radius:10px; padding:10px; outline: none;">
                <button onclick="sendChat()" style="background:var(--accent); border:none; border-radius:10px; padding:0 15px; cursor:pointer;">➤</button>
            </div>
        </div>
    </div>

    <script>
        // --- DRAGGABLE LOGIC ---
        const dragItem = document.getElementById("local-container");
        let active = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

        const dragStart = (e) => {
            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }
            if (e.target === dragItem || dragItem.contains(e.target)) active = true;
        };

        const dragEnd = () => { initialX = currentX; initialY = currentY; active = false; };
        const drag = (e) => {
            if (active) {
                e.preventDefault();
                const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
                const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
                currentX = clientX - initialX;
                currentY = clientY - initialY;
                xOffset = currentX; yOffset = currentY;
                dragItem.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }
        };

        document.addEventListener("touchstart", dragStart, {passive: false});
        document.addEventListener("touchend", dragEnd, {passive: false});
        document.addEventListener("touchmove", drag, {passive: false});
        document.addEventListener("mousedown", dragStart, false);
        document.addEventListener("mouseup", dragEnd, false);
        document.addEventListener("mousemove", drag, false);

        // --- PIP & CHAT LOGIC ---
        const pipBtn = document.getElementById('pipBtn');
        const remoteVideo = document.getElementById('remoteVideo');
        const chatInput = document.getElementById('chatMsg');

        // Toggle Picture-in-Picture
        pipBtn.onclick = async () => {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await remoteVideo.requestPictureInPicture();
                }
            } catch (err) { alert("PiP not supported on this browser"); }
        };

        // Enter to send chat
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        // --- WebRTC & Pusher Logic ---
        const PUSHER_KEY = 'c7f2cd8e7835a9dc4425';
        let localStream, pc, roomId, channel, screenStream;
        const pusher = new Pusher(PUSHER_KEY, { cluster: 'ap2' });
        const iceConfig = { iceServers: [{ urls: "stun:stun.relay.metered.ca:80" }, { urls: "turn:global.relay.metered.ca:80", username: "d1ef88d6301c48637e8bf9c7", credential: "vswYqgZljtLXECWu" }] };

        document.getElementById('joinBtn').onclick = async () => {
            roomId = document.getElementById('roomInput').value;
            if(!roomId) return;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('meeting-ui').style.display = 'block';
            document.getElementById('display-room-id').innerText = roomId;

            localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('localVideo').srcObject = localStream;

            pc = new RTCPeerConnection(iceConfig);
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
            pc.onicecandidate = e => e.candidate && sendSig({candidate: e.candidate});

            channel = pusher.subscribe(`room-${roomId}`);
            channel.bind('new-signal', async d => {
                if(d.sender === pusher.connection.socket_id) return;
                if(d.type === 'ready') { const o = await pc.createOffer(); await pc.setLocalDescription(o); sendSig(o); }
                else if(d.type === 'offer') { await pc.setRemoteDescription(new RTCSessionDescription(d)); const a = await pc.createAnswer(); await pc.setLocalDescription(a); sendSig(a); }
                else if(d.type === 'answer') await pc.setRemoteDescription(new RTCSessionDescription(d));
                else if(d.candidate) pc.addIceCandidate(new RTCIceCandidate(d.candidate));
            });
            channel.bind('new-chat', d => {
                const b = document.getElementById('chat-body');
                const isSelf = d.sender_id === pusher.connection.socket_id;
                b.innerHTML += `
                    <div style="margin-bottom:10px; text-align: ${isSelf ? 'right' : 'left'}">
                        <span style="display:inline-block; background:${isSelf ? 'var(--accent)' : 'var(--glass)'}; color:${isSelf ? '#000' : '#fff'}; padding:8px 12px; border-radius:12px; font-size:14px; max-width: 80%;">
                            ${d.msg}
                        </span>
                    </div>`;
                b.scrollTop = b.scrollHeight;
            });
            sendSig({type:'ready'});
        };

        async function sendSig(d) { fetch('/send-signal', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({...d, room:roomId, sender:pusher.connection.socket_id})}); }
        
        function sendChat() { 
            const i = document.getElementById('chatMsg'); 
            if(!i.value.trim()) return;
            fetch('/send-chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({room:roomId, msg:i.value, sender_id: pusher.connection.socket_id})}); 
            i.value = ''; 
        }

        function toggleMic() { const t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled; document.getElementById('micBtn').classList.toggle('off', !t.enabled); }
        function toggleCam() { const t = localStream.getVideoTracks()[0]; t.enabled = !t.enabled; document.getElementById('camBtn').classList.toggle('off', !t.enabled); }
        function toggleChat() { 
            const w = document.getElementById('chat-window'); 
            w.style.display = w.style.display === 'flex' ? 'none' : 'flex'; 
            if(w.style.display === 'flex') document.getElementById('chatMsg').focus();
        }
        
        async function toggleShare() {
            if(!screenStream) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({video: true});
                    const vt = screenStream.getVideoTracks()[0];
                    const sender = pc.getSenders().find(s => s.track.kind === 'video');
                    sender.replaceTrack(vt);
                    vt.onended = stopShare;
                    document.getElementById('shareBtn').classList.add('off');
                    document.getElementById('localVideo').srcObject = screenStream;
                } catch (e) { console.error(e); }
            } else { stopShare(); }
        }

        function stopShare() {
            if (pc) {
                const videoTrack = localStream.getVideoTracks()[0];
                const sender = pc.getSenders().find(s => s.track.kind === 'video');
                sender.replaceTrack(videoTrack);
            }
            if(screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            document.getElementById('shareBtn').classList.remove('off');
            document.getElementById('localVideo').srcObject = localStream;
        }
    </script>
</body>
</html>
