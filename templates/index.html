<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Serverless Video Call</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #0070f3; --danger: #ff4d4d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header { width: 100%; padding: 15px; background: var(--card); text-align: center; border-bottom: 1px solid #333; }
        
        .main-container { width: 95%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; flex: 1; padding: 20px; }
        
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 100%; margin-top: 20px; }
        .video-wrapper { position: relative; background: #000; border-radius: 15px; overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        video { width: 100%; height: 100%; object-fit: cover; }
        .label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 5px; font-size: 0.8em; }

        .controls-bar { position: fixed; bottom: 30px; background: var(--card); padding: 15px 30px; border-radius: 50px; display: flex; gap: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.8); border: 1px solid #333; z-index: 100; }
        
        button { padding: 12px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; width: 50px; height: 50px; }
        .btn-active { background: #333; color: white; }
        .btn-inactive { background: var(--danger); color: white; }
        .btn-join { background: var(--primary); color: white; border-radius: 25px; width: auto; padding: 0 25px; }
        
        input { background: #2a2a2a; border: none; color: white; padding: 10px 20px; border-radius: 25px; outline: none; margin-right: 10px; }
        #status { font-size: 0.8em; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Live Room</h2>
        <div id="setup-ui">
            <input type="text" id="roomInput" placeholder="Room ID">
            <button id="joinBtn" class="btn-join">Join Meeting</button>
        </div>
        <div id="status">Ready to join</div>
    </div>

    <div class="main-container">
        <div class="video-grid">
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="label">You</div>
            </div>
            <div class="video-wrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="label">Partner</div>
            </div>
        </div>
    </div>

    <div class="controls-bar" id="controls" style="display: none;">
        <button id="micBtn" class="btn-active" title="Toggle Mic">🎤</button>
        <button id="camBtn" class="btn-active" title="Toggle Camera">📷</button>
        <button id="endBtn" class="btn-inactive" style="border-radius: 25px; width: auto; padding: 0 20px;">End Call</button>
    </div>

    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        const PUSHER_KEY = 'c7f2cd8e7835a9dc4425';
        const PUSHER_CLUSTER = 'ap2';
        let localStream, pc, roomId, channel;
        let isMicOn = true, isCamOn = true;

        const pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });

        // YOUR METERED.CA TURN CREDENTIALS
        const iceConfig = {
            iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                { 
                    urls: "turn:global.relay.metered.ca:80", 
                    username: "d1ef88d6301c48637e8bf9c7", 
                    credential: "vswYqgZljtLXECWu" 
                },
                { 
                    urls: "turn:global.relay.metered.ca:80?transport=tcp", 
                    username: "d1ef88d6301c48637e8bf9c7", 
                    credential: "vswYqgZljtLXECWu" 
                },
                { 
                    urls: "turn:global.relay.metered.ca:443", 
                    username: "d1ef88d6301c48637e8bf9c7", 
                    credential: "vswYqgZljtLXECWu" 
                },
                { 
                    urls: "turns:global.relay.metered.ca:443?transport=tcp", 
                    username: "d1ef88d6301c48637e8bf9c7", 
                    credential: "vswYqgZljtLXECWu" 
                }
            ]
        };

        document.getElementById('joinBtn').onclick = async () => {
            roomId = document.getElementById('roomInput').value;
            if (!roomId) return alert("Enter Room ID");

            document.getElementById('status').innerText = "Accessing media...";
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('setup-ui').style.display = 'none';
                document.getElementById('controls').style.display = 'flex';
            } catch (e) {
                return alert("Media Error: " + e.message);
            }

            initPeerConnection();
            channel = pusher.subscribe(`room-${roomId}`);
            channel.bind('new-signal', async (data) => {
                if (data.sender === pusher.connection.socket_id) return;

                if (data.type === 'ready') {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    sendSignal(offer);
                } else if (data.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    sendSignal(answer);
                } else if (data.type === 'answer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                } else if (data.candidate) {
                    try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e) {}
                } else if (data.type === 'end') {
                    location.reload();
                }
            });

            sendSignal({ type: 'ready' });
            document.getElementById('status').innerText = "Waiting for partner...";
        };

        function initPeerConnection() {
            pc = new RTCPeerConnection(iceConfig);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.ontrack = (e) => {
                document.getElementById('remoteVideo').srcObject = e.streams[0];
                document.getElementById('status').innerText = "Status: Connected (Live)";
            };

            pc.onicecandidate = (e) => {
                if (e.candidate) sendSignal({ candidate: e.candidate });
            };
        }

        async function sendSignal(data) {
            await fetch('/send-signal', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ...data, room: roomId, sender: pusher.connection.socket_id })
            });
        }

        // CONTROL BUTTONS LOGIC
        document.getElementById('micBtn').onclick = () => {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            document.getElementById('micBtn').className = isMicOn ? 'btn-active' : 'btn-inactive';
            document.getElementById('micBtn').innerText = isMicOn ? '🎤' : '🔇';
        };

        document.getElementById('camBtn').onclick = () => {
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;
            document.getElementById('camBtn').className = isCamOn ? 'btn-active' : 'btn-inactive';
            document.getElementById('camBtn').innerText = isCamOn ? '📷' : '🚫';
        };

        document.getElementById('endBtn').onclick = () => {
            sendSignal({ type: 'end' });
            location.reload();
        };
    </script>
</body>
</html>
