<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlassCall Pro</title>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --accent: #00f2fe;
            --danger: #ff4d4d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: white; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        /* Setup Screen */
        #setup-screen {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 24px; border: 1px solid var(--glass-border);
            text-align: center; width: 90%; max-width: 400px;
        }
        input { 
            width: 100%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2); color: white; outline: none;
        }
        .btn-main { 
            background: var(--accent); color: #000; padding: 15px 30px; border-radius: 12px; 
            border: none; font-weight: bold; cursor: pointer; width: 100%;
        }

        /* Meeting UI */
        #meeting-ui { display: none; width: 100vw; height: 100vh; flex-direction: column; }

        /* Top Bar */
        .top-bar { 
            padding: 15px 25px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
        }

        /* Dynamic Video Layout */
        .video-content { flex: 1; display: grid; position: relative; padding: 20px; gap: 15px; }
        .main-stream { width: 100%; height: 100%; border-radius: 20px; object-fit: cover; background: #000; }
        #local-mini { 
            position: absolute; top: 40px; right: 40px; width: 180px; aspect-ratio: 16/9; 
            border-radius: 12px; border: 2px solid var(--glass-border); z-index: 10;
        }

        /* Floating Controls */
        .controls { 
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; padding: 12px 25px; border-radius: 40px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
        }
        .icon-btn { 
            width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 20px; background: #334155; color: white;
        }
        .btn-off { background: var(--danger) !important; }

        /* Chat Window (Glassmorphism Pop-out) */
        #chat-window {
            position: fixed; right: 20px; bottom: 100px; width: 320px; height: 450px;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(30px);
            border-radius: 20px; border: 1px solid var(--glass-border);
            display: none; flex-direction: column; z-index: 100;
        }
        .chat-header { padding: 15px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; }
        #chat-msgs { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-input-area { padding: 15px; display: flex; gap: 5px; }

        @media (max-width: 768px) {
            #local-mini { width: 120px; top: 20px; right: 20px; }
            .controls { bottom: 20px; gap: 10px; padding: 10px 15px; }
            .icon-btn { width: 40px; height: 40px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2>Join Meeting</h2>
        <input type="text" id="roomInput" placeholder="Enter Meeting Code">
        <button id="joinBtn" class="btn-main">Join Now</button>
    </div>

    <div id="meeting-ui">
        <div class="top-bar">
            <div>Code: <b id="displayCode">---</b></div>
            <button onclick="location.reload()" style="background:var(--danger); border:none; color:white; padding:8px 15px; border-radius:8px; cursor:pointer;">Leave</button>
        </div>

        <div class="video-content">
            <video id="remoteVideo" class="main-stream" autoplay playsinline></video>
            <video id="localVideo" id="local-mini" autoplay muted playsinline style="position: absolute; top: 20px; right: 20px; width: 150px; border-radius: 10px; border: 2px solid white;"></video>
        </div>

        <div class="controls">
            <button onclick="toggleMic()" id="micBtn" class="icon-btn">🎤</button>
            <button onclick="toggleCam()" id="camBtn" class="icon-btn">📷</button>
            <button onclick="toggleScreen()" id="screenBtn" class="icon-btn">📺</button>
            <button onclick="togglePip()" class="icon-btn">🖼️</button>
            <button onclick="toggleChat()" class="icon-btn">💬</button>
            <button onclick="location.reload()" class="icon-btn btn-off">📞</button>
        </div>

        <div id="chat-window">
            <div class="chat-header">
                <span>Group Chat</span>
                <button onclick="toggleChat()" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
            </div>
            <div id="chat-msgs"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type..." style="margin:0; padding:10px;">
                <button onclick="sendChat()" style="background:var(--accent); border:none; padding:10px; border-radius:8px;">➤</button>
            </div>
        </div>
    </div>

    <script>
        const PUSHER_KEY = 'c7f2cd8e7835a9dc4425';
        let localStream, pc, roomId, channel, screenStream;
        const pusher = new Pusher(PUSHER_KEY, { cluster: 'ap2' });
        
        const iceConfig = { iceServers: [
            { urls: "stun:stun.relay.metered.ca:80" },
            { urls: "turn:global.relay.metered.ca:80", username: "d1ef88d6301c48637e8bf9c7", credential: "vswYqgZljtLXECWu" }
        ]};

        document.getElementById('joinBtn').onclick = async () => {
            roomId = document.getElementById('roomInput').value;
            if(!roomId) return alert("Enter a code");
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('meeting-ui').style.display = 'flex';
            document.getElementById('displayCode').innerText = roomId;

            localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('localVideo').srcObject = localStream;

            initPeerConnection();
            channel = pusher.subscribe(`room-${roomId}`);
            
            channel.bind('new-signal', async d => {
                if(d.sender === pusher.connection.socket_id) return;
                if(d.type === 'ready') { const o = await pc.createOffer(); await pc.setLocalDescription(o); sendSignal(o); }
                else if(d.type === 'offer') { await pc.setRemoteDescription(new RTCSessionDescription(d)); const a = await pc.createAnswer(); await pc.setLocalDescription(a); sendSignal(a); }
                else if(d.type === 'answer') await pc.setRemoteDescription(new RTCSessionDescription(d));
                else if(d.candidate) await pc.addIceCandidate(new RTCIceCandidate(d.candidate));
            });

            channel.bind('new-chat', d => {
                const area = document.getElementById('chat-msgs');
                area.innerHTML += `<div style="background:rgba(255,255,255,0.1); padding:8px; border-radius:8px; font-size:14px;">${d.msg}</div>`;
                area.scrollTop = area.scrollHeight;
            });

            sendSignal({type: 'ready'});
        };

        function initPeerConnection() {
            pc = new RTCPeerConnection(iceConfig);
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
            pc.onicecandidate = e => e.candidate && sendSignal({candidate: e.candidate});
        }

        async function toggleScreen() {
            if(!screenStream) {
                screenStream = await navigator.mediaDevices.getDisplayMedia({video: true});
                pc.getSenders().find(s => s.track.kind === 'video').replaceTrack(screenStream.getVideoTracks()[0]);
                document.getElementById('remoteVideo').srcObject = screenStream; // Preview
                document.getElementById('screenBtn').classList.add('btn-off');
            } else {
                pc.getSenders().find(s => s.track.kind === 'video').replaceTrack(localStream.getVideoTracks()[0]);
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
                document.getElementById('screenBtn').classList.remove('btn-off');
            }
        }

        async function togglePip() {
            try { await document.getElementById('remoteVideo').requestPictureInPicture(); } catch(e) {}
        }

        function toggleMic() {
            const t = localStream.getAudioTracks()[0];
            t.enabled = !t.enabled;
            document.getElementById('micBtn').classList.toggle('btn-off', !t.enabled);
        }

        function toggleCam() {
            const t = localStream.getVideoTracks()[0];
            t.enabled = !t.enabled;
            document.getElementById('camBtn').classList.toggle('btn-off', !t.enabled);
        }

        function toggleChat() {
            const w = document.getElementById('chat-window');
            w.style.display = (w.style.display === 'flex') ? 'none' : 'flex';
        }

        async function sendChat() {
            const i = document.getElementById('chatInput');
            if(!i.value) return;
            await fetch('/send-chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({room: roomId, msg: i.value, sender: pusher.connection.socket_id})});
            i.value = '';
        }

        async function sendSignal(d) {
            fetch('/send-signal', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({...d, room: roomId, sender: pusher.connection.socket_id})});
        }
    </script>
</body>
</html>
