<!DOCTYPE html>
<html>
<head>
    <title>Serverless Video Call</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #1a1a1a; color: white; }
        .video-box { width: 45%; max-width: 400px; background: #000; border-radius: 10px; }
        .container { display: flex; gap: 20px; justify-content: center; width: 100%; margin-top: 20px; }
        .controls { margin-top: 20px; background: #333; padding: 20px; border-radius: 10px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        #joinBtn { background: #28a745; color: white; }
        #endBtn { background: #dc3545; color: white; display: none; }
        input { padding: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="roomInput" placeholder="Room Code (e.g. 123)">
        <button id="joinBtn">Join Call</button>
        <button id="endBtn">End Call</button>
        <p id="status">Status: Offline</p>
    </div>

    <div class="container">
        <video id="localVideo" class="video-box" autoplay muted playsinline></video>
        <video id="remoteVideo" class="video-box" autoplay playsinline></video>
    </div>

    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        const PUSHER_KEY = 'c7f2cd8e7835a9dc4425';
        const PUSHER_CLUSTER = 'ap2';
        
        let localStream, pc, roomId, channel;
        const pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
        const iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        document.getElementById('joinBtn').onclick = async () => {
            roomId = document.getElementById('roomInput').value;
            if (!roomId) return alert("Enter a room code");

            document.getElementById('status').innerText = "Connecting...";
            
            // 1. Setup Local Media
            localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('localVideo').srcObject = localStream;

            // 2. Initialize Connection
            initPeerConnection();

            // 3. Join Pusher Room
            channel = pusher.subscribe(`room-${roomId}`);
            
            channel.bind('new-signal', async (data) => {
                if (data.sender === pusher.connection.socket_id) return;

                if (data.type === 'ready') {
                    // Someone else joined! Create the offer.
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    sendSignal(offer);
                } else if (data.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    sendSignal(answer);
                } else if (data.type === 'answer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                } else if (data.candidate) {
                    try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e) {}
                } else if (data.type === 'end') {
                    handleRemoteHangup();
                }
            });

            // 4. Tell everyone we are ready to receive an offer
            sendSignal({ type: 'ready' });

            document.getElementById('joinBtn').style.display = 'none';
            document.getElementById('endBtn').style.display = 'inline-block';
            document.getElementById('status').innerText = "In Room: " + roomId;
        };

        function initPeerConnection() {
            pc = new RTCPeerConnection(iceConfig);
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) sendSignal({ candidate: event.candidate });
            };
        }

        async function sendSignal(data) {
            await fetch('/send-signal', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ ...data, room: roomId, sender: pusher.connection.socket_id })
            });
        }

        document.getElementById('endBtn').onclick = () => {
            sendSignal({ type: 'end' });
            location.reload(); // Refresh to reset state
        };

        function handleRemoteHangup() {
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('status').innerText = "Partner disconnected.";
            if(pc) pc.close();
            initPeerConnection(); // Prepare for next join
        }
    </script>
</body>
</html>
